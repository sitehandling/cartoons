<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#050714">

    <title>Ben 10 Classic — S1 E1 | ToonStream</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">


    <style>

        /* =========================================
           WATCH PAGE
        ========================================= */

        .watch-page {

            padding: 35px 40px 80px;

        }


        /* =========================================
           BACK BUTTON
        ========================================= */

        .watch-back {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 10px 20px;

            margin-bottom: 25px;

            border: 1px solid #00eaff;

            border-radius: 30px;

            color: #ffffff;

            text-decoration: none;

            transition: .3s ease;

        }


        .watch-back:hover {

            transform: translateX(-4px);

            box-shadow:
                0 0 18px
                rgba(0,234,255,.45);

        }

        /* =========================================
           VIDEO PLAYER
        ========================================= */

.player-wrapper {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
}

.video-player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;

    border-radius: 20px;

    border: 1px solid
        rgba(0, 234, 255, .35);

    background:
        radial-gradient(
            circle at center,
            #101936,
            #050714 70%
        );

    box-shadow:
        0 0 30px
        rgba(0, 234, 255, .12);
}

/* Mux iframe */

.video-player iframe {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    border: 0;
}
/* =========================================
   MOBILE PLAYER
========================================= */

@media (max-width: 768px) {

    .video-player {
        border-radius: 14px;
    }

}


@media (max-width: 480px) {

    .video-player {
        border-radius: 10px;
    }

}

        /* =========================================
           EPISODE INFORMATION
        ========================================= */

        .episode-details {

            max-width: 1200px;

            margin: 28px auto 0;

        }


        .episode-label {

            display: inline-block;

            padding: 6px 12px;

            margin-bottom: 10px;

            border-radius: 20px;

            color: #ffffff;

            font-size: 11px;

            font-weight: 900;

            background:
                linear-gradient(
                    90deg,
                    #ff009d,
                    #7c3cff,
                    #00eaff
                );

        }


        .episode-details h1 {

            margin: 0 0 8px;

            color: #ffffff;

            font-size: 30px;

        }


        .episode-details p {

            margin: 0;

            color: #aeb5d4;

            font-size: 14px;

        }


        /* =========================================
           PLAYER CONTROLS / NAVIGATION
        ========================================= */

        .episode-navigation {

            display: flex;

            justify-content: space-between;

            gap: 15px;

            margin-top: 25px;

        }


        .episode-nav-button {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 11px 20px;

            border: 1px solid
                rgba(255,255,255,.18);

            border-radius: 30px;

            color: #ffffff;

            background:
                rgba(255,255,255,.04);

            text-decoration: none;

            transition: .3s ease;

        }


        .episode-nav-button:hover {

            border-color: #00eaff;

            box-shadow:
                0 0 16px
                rgba(0,234,255,.3);

        }


        .next-button {

            border-color:
                rgba(255,0,170,.45);

        }


        .next-button:hover {

            border-color: #ff00aa;

            box-shadow:
                0 0 16px
                rgba(255,0,170,.3);

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .watch-page {

                padding:
                    25px 18px 60px;

            }


            .episode-details h1 {

                font-size: 24px;

            }


            .episode-navigation {

                flex-direction: column;

            }


            .episode-nav-button {

                justify-content: center;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         CUSTOM CURSOR
    ========================================= -->

    <div class="cursor-dot"></div>

    <div class="cursor-ring"></div>


    <!-- =========================================
         BACKGROUND EFFECTS
    ========================================= -->

    <div class="background-effects">

        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>
        <span class="particle p5"></span>
        <span class="particle p6"></span>

    </div>


    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="main-content watch-page">


        <div class="player-wrapper">


            <!-- BACK -->

            <a
                href="ben10-classic-season1.html"
                class="watch-back">

                ← Back to Episodes

            </a>


            <!-- =====================================
                 VIDEO PLAYER
            ====================================== -->

            <div class="video-player">


             <iframe
  src="https://player.mux.com/LfWTvuh5utlfvb4gCWNh601B1tB6p39HNVYeId5IbhDQ"
  style="width: 100%; border: none; aspect-ratio: 16/9;"
  allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
  allowfullscreen
></iframe>

            </div>


            <!-- =====================================
                 EPISODE DETAILS
            ====================================== -->

            <div class="episode-details">


                <span class="episode-label">
                    BEN 10 CLASSIC • SEASON 1 • EPISODE 07
                </span>


                <h1>
                    Kevin 11
                </h1>


                <p>
                    “Kevin 11” stands as one of the defining episodes of the original Ben 10 series, introducing a tragic and complex rival who would shape Ben’s journey for years. 
                </p>


                <!-- =================================
                     EPISODE NAVIGATION
                ================================== -->

                <div class="episode-navigation">


                    <a
                        href="ben10-classic-season1.html"
                        class="episode-nav-button">

                        ← All Episodes

                    </a>


                    <a
                        href="ben10-classic-s1-ep8.html"
                        class="episode-nav-button next-button">

                        Next Episode →

                    </a>


                </div>


            </div>


        </div>


    </main>


    <script src="../js/app.js"></script>

</body>

</html>
